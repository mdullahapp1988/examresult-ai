<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamResult AI - Instant AI Exam Results & Grading Portal</title>
    
    <!-- SEO Meta Keywords & Description for Google Search Ranking -->
    <meta name="description" content="ExamResult AI is an advanced AI-powered platform for checking exam results, automated grading, and test generation in multiple languages.">
    <meta name="keywords" content="Exam Result, ExamResult AI, AI Grading Tool, BD Exam Result, Online Exam Checker, School Exam Results">
    <meta name="author" content="Mohammadullah Sikder">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid #007bff;
        }
        .creator-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .creator-title {
            font-size: 14px;
            color: #007bff;
            margin-bottom: 20px;
        }
        select {
            padding: 8px 12px;
            font-size: 16px;
            margin-bottom: 25px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        h1 {
            color: #222;
        }
        p {
            color: #666;
        }
        /* Ad Banner Container Style */
        .ad-container {
            margin-top: 25px;
            padding: 15px;
            background: #eaeaea;
            border: 2px dashed #ccc;
            border-radius: 8px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Language Selector Dropdown for 30 Languages -->
    <label for="langSelect">🌐 Language / ভাষা: </label>
    <select id="langSelect" onchange="changeLanguage()">
        <option value="bn">বাংলা (Bengali)</option>
        <option value="en" selected>English</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="hi">हिन्दी (Hindi)</option>
        <option value="ur">اردو (Urdu)</option>
        <option value="ar">العربية (Arabic)</option>
        <option value="zh-CN">中文 (Chinese - Simplified)</option>
        <option value="zh-TW">繁體中文 (Chinese - Traditional)</option>
        <option value="ms">Malay / Bahasa</option>
        <option value="ja">日本語 (Japanese)</option>
        <option value="ko">한국어 (Korean)</option>
        <option value="es">Español (Spanish)</option>
        <option value="fr">Français (French)</option>
        <option value="de">Deutsch (German)</option>
        <option value="pt">Português (Portuguese)</option>
        <option value="ru">Русский (Russian)</option>
        <option value="it">Italiano (Italian)</option>
        <option value="tr">Türkçe (Turkish)</option>
        <option value="fa">فارسی (Persian)</option>
        <option value="vi">Tiếng Việt (Vietnamese)</option>
        <option value="th">ไทย (Thai)</option>
        <option value="tl">Filipino (Tagalog)</option>
        <option value="sw">Kiswahili (Swahili)</option>
        <option value="nl">Nederlands (Dutch)</option>
        <option value="el">Ελληνικά (Greek)</option>
        <option value="sv">Svenska (Swedish)</option>
        <option value="pl">Polski (Polish)</option>
        <option value="uk">Українська (Ukrainian)</option>
        <option value="te">తెలుగు (Telugu)</option>
        <option value="mr">मराठी (Marathi)</option>
    </select>

    <br>
    <!-- Profile Image (আপনার ছবির আসল ফাইলের নাম এখানে বসাবেন) -->
    <img src="your-profile-image.jpg" alt="Mohammadullah Sikder" class="profile-img" id="profileImg">
    
    <!-- Creator Name & Title -->
    <div class="creator-name">Mohammadullah Sikder</div>
    <div class="creator-title">Founder & Developer</div>

    <!-- App Content -->
    <h1 id="appTitle">ExamResult AI</h1>
    <p id="appDesc">Welcome to the next-generation AI-powered exam results and grading portal.</p>

    <!-- Future Ad Placeholder (ভবিষ্যতে বিজ্ঞাপন কোড এখানে বসবে) -->
    <div class="ad-container">
        <p>📢 Advertisement Space (Google AdSense / AdMob Code Will Go Here)</p>
    </div>
</div>

<script>
    // Translation dictionary for multiple languages
    const texts = {
        en: {
            title: "ExamResult AI",
            desc: "Welcome to the next-generation AI-powered exam results and grading portal."
        },
        bn: {
            title: "এক্সাম রেজাল্ট এআই",
            desc: "পরবর্তী প্রজন্মের এআই-চালিত পরীক্ষার ফলাফল এবং গ্রেডিং পোর্টালে স্বাগতম।"
        },
        ta: {
            title: "ExamResult AI",
            desc: "அடுத்த தலைமுறை AI-இயங்கும் தேர்வு முடிவு மற்றும் தரப்படுத்தும் போர்ட்டலுக்கு உங்களை வரவேற்கிறோம்."
        },
        hi: {
            title: "ExamResult AI",
            desc: "अगली पीढ़ी के AI-संचालित परीक्षा परिणाम और ग्रेडिंग पोर्टल में आपका स्वागत है।"
        },
        ar: {
            title: "ExamResult AI",
            desc: "مرحبًا بكم في الجيل القادم من بوابة نتائج الامتحانات وتقييمها المدعومة بالذكاء الاصطناعي."
        },
        zh-CN: {
            title: "ExamResult AI",
            desc: "欢迎来到新一代人工智能考试成绩和评分门户网站。"
        },
        ms: {
            title: "ExamResult AI",
            desc: "Selamat datang ke portal keputusan peperiksaan dan penggredan bertenaga AI generasi seterusnya."
        }
    };

    function changeLanguage() {
        const selectedLang = document.getElementById("langSelect").value;
        const titleEl = document.getElementById("appTitle");
        const descEl = document.getElementById("appDesc");

        if (texts[selectedLang]) {
            titleEl.innerText = texts[selectedLang].title;
            descEl.innerText = texts[selectedLang].desc;
        } else {
            titleEl.innerText = "ExamResult AI";
            descEl.innerText = "Welcome to the AI-powered exam result portal.";
        }
    }
</script>

</body>
                                                                     </html>
