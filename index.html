      <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamResult AI - Mohammadullah Sikder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            font-size: 26px;
            transition: color 0.3s;
        }
        .profile-section {
            text-align: center;
            margin-bottom: 25px;
        }
        .profile-section h3 {
            margin: 8px 0 2px;
            color: #34495e;
        }
        .profile-section span {
            color: #2980b9;
            font-size: 14px;
            font-weight: 600;
        }
        .section-box {
            background: #f9f9f9;
            border: 1px solid #e1e1e1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .section-box h4 {
            margin-top: 0;
            color: #2c3e50;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="file"], input[type="text"], select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .row-group {
            display: flex;
            gap: 15px;
        }
        .row-group > div {
            flex: 1;
        }
        button {
            background-color: #27ae60;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #219653;
        }
        .voice-btn {
            background-color: #e74c3c;
        }
        .voice-btn:hover {
            background-color: #c0392b;
        }
        .preview-output {
            background: #fff;
            border: 2px dashed #2980b9;
            padding: 25px;
            margin-top: 20px;
            border-radius: 6px;
            display: none;
            position: relative;
        }
        /* লোগো যেন পুরোটা একদম সুন্দরভাবে শো করে */
        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .preview-logo {
            width: 80px;
            height: 80px;
            border: 2px solid #2980b9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            font-size: 11px;
            font-weight: bold;
            color: #2980b9;
            text-align: center;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 3px;
        }
        .preview-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* লোগোর সম্পূর্ণ ছবি নিখুঁতভাবে দেখাবে কোনো ক্রপ ছাড়াই */
        }
        .official-seal {
            border: 2px dashed #e74c3c;
            color: #e74c3c;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            transform: rotate(-15deg);
            margin: 20px auto 0 auto;
            background: rgba(231, 76, 60, 0.03);
        }
        .ad-space {
            border: 2px dashed #bdc3c7;
            background: #ecf0f1;
            padding: 15px;
            text-align: center;
            color: #7f8c8d;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- লোগো ও ব্র্যান্ডিং -->
    <div class="profile-section">
        <h3>Mohammadullah Sikder</h3>
        <span>Founder & Developer</span>
    </div>

    <div class="header">
        <h2 id="mainTitleStyle" style="color: #2c3e50;">ExamResult AI Platform</h2>
        <p>সম্পূর্ণ রঙিন লোগো, সিল, ফরম ও প্রশ্নপত্র জেনারেটর</p>
    </div>

    <!-- ডিজাইন, কালার, লোগো ও সিল কাস্টমাইজেশন সেকশন -->
    <div class="section-box">
        <h4>🎨 লোগো, সিল ও ডিজাইন কাস্টমাইজেশন</h4>
        <div class="row-group">
            <div>
                <label>শিরোনামের কালার:</label>
                <input type="color" id="titleColorPicker" value="#2c3e50" onchange="changeTitleColor()" style="height: 40px; padding: 5px;">
            </div>
            <div>
                <label>প্রতিষ্ঠানের রঙিন লোগো আপলোড:</label>
                <input type="file" id="logoInput" accept="image/*">
            </div>
        </div>
        <div class="row-group">
            <div>
                <label>সিলের টেক্সট (যেমন: প্রধান শিক্ষক ও সিল):</label>
                <input type="text" id="sealText" value="প্রধান শিক্ষক ও সিল">
            </div>
            <div>
                <label>টেমপ্লেট স্টাইল:</label>
                <select id="designStyle" onchange="changeTitleColor()">
                    <option value="classic">ক্লাসিক ও ফরমাল</option>
                    <option value="modern">মডার্ন ও স্টাইলিশ</option>
                </select>
            </div>
        </div>
    </div>

    <!-- এআই ভয়েস কমান্ড ও ইউনিভার্সাল জেনারেটর সেকশন -->
    <div class="section-box">
        <h4>🎙️ এআই ভয়েস কমান্ড ও স্মার্ট জেনারেটর</h4>
        
        <label>১. মুখে বলে বা লিখে নির্দেশ দিন:</label>
        <textarea id="aiCommand" rows="3" placeholder="যেমন: 'প্রথম শ্রেণীর বাংলা প্রশ্ন এবং সিলসহ তৈরি করো'..."></textarea>

        <button class="voice-btn" onclick="startVoiceCommand()">🎙️ ভয়েস কমান্ড দিন (কথা বলুন)</button>

        <label>২. অথবা প্রশ্নপত্র বা ফরমের ছবি আপলোড করুন:</label>
        <input type="file" id="imageInput" accept="image/*">

        <label>প্রতিষ্ঠান বা সংস্থার নাম:</label>
        <input type="text" id="institutionName" value="আলহাজ্ব সিরাজুল হক নূরানী ও হাফেজিয়া মাদ্রাসা">

        <button onclick="generateAdvancedContentWithLogo()">সম্পূর্ণ লোগো ও সিলসহ ফরম্যাট তৈরি করুন</button>

        <!-- আউটপুট প্রিভিউ বক্স -->
        <div class="preview-output" id="outputBox">
            <div class="preview-header">
                <div class="preview-logo" id="logoContainer">লোগো</div>
                <div style="flex-grow: 1; text-align: center; padding: 0 10px;">
                    <h3 style="margin: 0; color:#2c3e50;" id="outTitle"></h3>
                    <p style="margin: 3px 0 0; font-weight:bold; color:#555; font-size: 13px;" id="outSub"></p>
                </div>
                <div class="preview-logo" style="border: none; background: transparent; visibility: hidden;"></div>
            </div>
            
            <div id="outContent"></div>

            <!-- অফিশিয়াল রঙিন সিল -->
            <div class="official-seal" id="outSeal">
                <span id="sealDisplayText">প্রধান শিক্ষক<br>মোহাম্মদউল্লাহ সিকদার</span>
            </div>
        </div>
    </div>

    <!-- ফিউচার মোনেটাইজেশন অ্যাড স্পেস -->
    <div class="ad-space">
        📢 Advertisement Space (Google AdSense / AdMob Code Will Go Here)
    </div>
</div>

<script>
    function changeTitleColor() {
        const color = document.getElementById('titleColorPicker').value;
        const style = document.getElementById('designStyle').value;
        const titleElem = document.getElementById('mainTitleStyle');
        
        titleElem.style.color = color;
        if(style === 'modern') {
            titleElem.style.fontFamily = "'Courier New', Courier, monospace";
        } else {
            titleElem.style.fontFamily = "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif";
        }
    }

    function startVoiceCommand() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert('দুঃখিত, আপনার ব্রাউজারটি ভয়েস কমান্ড সাপোর্ট করে না।');
            return;
        }
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'bn-BD';
        recognition.start();

        alert('শুনছি... কথা বলুন!');

        recognition.onresult = function(event) {
            const speechText = event.results[0][0].transcript;
            document.getElementById('aiCommand').value = speechText;
            alert('ভয়েস কমান্ড গ্রহণ করা হয়েছে: ' + speechText);
        };
    }

    function generateAdvancedContentWithLogo() {
        const commandText = document.getElementById('aiCommand').value;
        const instName = document.getElementById('institutionName').value;
        const sealInput = document.getElementById('sealText').value;
        const outputBox = document.getElementById('outputBox');
        const logoInput = document.getElementById('logoInput');
        
        let displayTitle = commandText.trim() !== "" ? commandText : "এআই জেনারেটেড ফরম ও প্রশ্নপত্র";
        
        document.getElementById('outTitle').innerText = instName;
        document.getElementById('outSub').innerText = displayTitle;
        document.getElementById('sealDisplayText').innerHTML = sealInput.replace(/ /g, '<br>');

        // লোগো যাতে পুরোটা নিখুঁতভাবে শো করে
        const logoContainer = document.getElementById('logoContainer');
        if(logoInput.files && logoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                logoContainer.innerHTML = `<img src="${e.target.result}" alt="Full Logo">`;
            }
            reader.readAsDataURL(logoInput.files[0]);
        } else {
            logoContainer.innerHTML = "লোগো";
        }
        
        let htmlContent = `
            <div style="line-height: 1.8; font-size: 14px; margin-top: 10px;">
                <p><b>পরীক্ষার বা ফরমের বিবরণ:</b> ${displayTitle}</p>
                <ul style="padding-left: 20px; margin: 5px 0;">
                    <li>১. নির্ধারিত বিষয় এবং মূল কাঠামো সফলভাবে বিন্যস্ত হয়েছে।</li>
                    <li>২. প্রশ্নপত্র বা ফরমের মান ও নির্দেশিকা নিখুঁতভাবে তৈরি।</li>
                    <li>৩. সমস্ত আইটেম প্রফেশনাল লেআউটে সাজানো হয়েছে।</li>
                </ul>
            </div>
        `;
        
        document.getElementById('outContent').innerHTML = htmlContent;
        outputBox.style.display = 'block';
        alert('সম্পূর্ণ লোগো ও সিলসহ ফরম্যাট তৈরি করা হয়েছে!');
    }
</script>

</body>
    </html>
    </html>
