 <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamResult AI - Mohammadullah Sikder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }
        .profile-card {
            text-align: center;
            background: linear-gradient(to bottom, #ffffff, #f9fbfc);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e1e8ed;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .developer-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2980b9;
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.3);
            margin-bottom: 12px;
        }
        .profile-card h2 {
            margin: 0 0 5px;
            color: #2c3e50;
            font-size: 24px;
        }
        .profile-card p {
            margin: 0;
            color: #2980b9;
            font-weight: 600;
            font-size: 15px;
        }
        .app-title-area {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
        }
        .app-title-area h1 {
            margin: 0;
            font-size: 28px;
            color: #1a252f;
        }
        .app-title-area p {
            color: #7f8c8d;
            margin: 5px 0 0;
            font-size: 14px;
        }
        .card-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .card-box h3 {
            margin-top: 0;
            color: #2d3748;
            font-size: 18px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #4a5568;
        }
        input[type="text"], input[type="file"], select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fff;
        }
        .grid-2 {
            display: flex;
            gap: 15px;
        }
        .grid-2 > div {
            flex: 1;
        }
        .btn {
            background-color: #2f855a;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #276749;
        }
        .btn-voice {
            background-color: #c53030;
        }
        .btn-voice:hover {
            background-color: #9b2c2c;
        }
        .preview-box {
            background: #ffffff;
            border: 2px dashed #3182ce;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        .preview-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #2d3748;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .preview-logo-area {
            width: 75px;
            height: 75px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            overflow: hidden;
            font-size: 11px;
            color: #718096;
            text-align: center;
        }
        .preview-logo-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .seal-circle {
            border: 2px dashed #e53e3e;
            color: #e53e3e;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            transform: rotate(-12deg);
            margin: 20px auto 0 auto;
            background: rgba(229, 62, 62, 0.02);
        }
        .footer-ad {
            text-align: center;
            background: #edf2f7;
            padding: 12px;
            border-radius: 6px;
            color: #718096;
            font-size: 12px;
            margin-top: 20px;
            border: 1px dashed #cbd5e0;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- প্রফেশনাল ডেভেলপার প্রোফাইল কার্ড (আপনার ছবিসহ) -->
    <div class="profile-card">
        <img src="https://i.ibb.co.com/65x7193/1789182988430.png" alt="Mohammadullah Sikder" class="developer-avatar">
        <h2>Mohammadullah Sikder</h2>
        <p>Founder & Developer</p>
    </div>

    <div class="app-title-area">
        <h1>ExamResult AI Platform</h1>
        <p>স্মার্ট লোগো, সিল, ফরম ও প্রশ্নপত্র জেনারেটর</p>
    </div>

    <!-- কাস্টমাইজেশন প্যানেল -->
    <div class="card-box">
        <h3>🎨 লোগো, সিল ও ডিজাইন কনফিগারেশন</h3>
        <div class="grid-2">
            <div>
                <label>শিরোনামের কালার:</label>
                <input type="color" id="titleColorPicker" value="#2c3e50" onchange="updateTheme()" style="height: 38px; padding: 4px;">
            </div>
            <div>
                <label>প্রতিষ্ঠানের রঙিন লোগো আপলোড:</label>
                <input type="file" id="logoInput" accept="image/*">
            </div>
        </div>
        <div class="grid-2">
            <div>
                <label>সিলের টেক্সট:</label>
                <input type="text" id="sealText" value="প্রধান শিক্ষক ও সিল">
            </div>
            <div>
                <label>টেমপ্লেট স্টাইল:</label>
                <select id="designStyle">
                    <option value="classic">ক্লাসিক ও ফরমাল</option>
                    <option value="modern">মডার্ন ও স্টাইলিশ</option>
                </select>
            </div>
        </div>
    </div>

    <!-- এআই ভয়েস ও ফরম জেনারেটর প্যানেল -->
    <div class="card-box">
        <h3>🎙️ এআই ভয়েস কমান্ড ও কন্টেন্ট জেনারেটর</h3>
        
        <label>১. মুখে বলে বা লিখে নির্দেশ দিন:</label>
        <textarea id="aiCommand" rows="3" placeholder="যেমন: 'প্রথম শ্রেণীর বাংলা প্রশ্ন এবং সিলসহ তৈরি করো'..."></textarea>

        <button class="btn btn-voice" onclick="startVoiceCommand()" style="margin-bottom: 12px;">🎙️ ভয়েস কমান্ড দিন (কথা বলুন)</button>

        <label>২. অথবা প্রশ্নপত্র বা ফরমের ছবি আপলোড করুন:</label>
        <input type="file" id="imageInput" accept="image/*">

        <label>প্রতিষ্ঠান বা সংস্থার নাম:</label>
        <input type="text" id="institutionName" placeholder="আপনার প্রতিষ্ঠানের নাম এখানে লিখুন...">

        <button class="btn" onclick="generatePlatformContent()">লোগো ও সিলসহ ফরম্যাট তৈরি করুন</button>

        <!-- প্রিভিউ আউটপুট সেকশন -->
        <div class="preview-box" id="outputBox">
            <div class="preview-top">
                <div class="preview-logo-area" id="logoContainer">লোগো</div>
                <div style="flex-grow: 1; text-align: center; padding: 0 10px;">
                    <h3 style="margin: 0; color:#2c3e50;" id="outTitle"></h3>
                    <p style="margin: 3px 0 0; font-weight:bold; color:#555; font-size: 13px;" id="outSub"></p>
                </div>
                <div class="preview-logo-area" style="border: none; background: transparent; visibility: hidden;"></div>
            </div>
            
            <div id="outContent"></div>

            <div class="seal-circle" id="outSeal">
                <span id="sealDisplayText">প্রধান শিক্ষক</span>
            </div>
        </div>
    </div>

    <div class="footer-ad">
        📢 Advertisement Space (Google AdSense / AdMob Code Will Go Here)
    </div>
</div>

<script>
    function updateTheme() {
        const color = document.getElementById('titleColorPicker').value;
        document.querySelector('.app-title-area h1').style.color = color;
    }

    function startVoiceCommand() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert('দুঃখিত, আপনার ব্রাউজারটি ভয়েস কমান্ড সাপোর্ট করে না।');
            return;
        }
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'bn-BD';
        recognition.start();

        alert('শুনছি... কথা বলুন!');

        recognition.onresult = function(event) {
            const speechText = event.results[0][0].transcript;
            document.getElementById('aiCommand').value = speechText;
        };
    }

    function generatePlatformContent() {
        const commandText = document.getElementById('aiCommand').value;
        const instName = document.getElementById('institutionName').value;
        const sealInput = document.getElementById('sealText').value;
        const outputBox = document.getElementById('outputBox');
        const logoInput = document.getElementById('logoInput');
        
        let displayTitle = commandText.trim() !== "" ? commandText : "এআই জেনারেটেড ফরম ও প্রশ্নপত্র";
        let finalInstName = instName.trim() !== "" ? instName : "প্রতিষ্ঠানের নাম";
        
        document.getElementById('outTitle').innerText = finalInstName;
        document.getElementById('outSub').innerText = displayTitle;
        document.getElementById('sealDisplayText').innerHTML = sealInput.replace(/ /g, '<br>');

        const logoContainer = document.getElementById('logoContainer');
        if(logoInput.files && logoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                logoContainer.innerHTML = `<img src="${e.target.result}" alt="Logo">`;
            }
            reader.readAsDataURL(logoInput.files[0]);
        } else {
            logoContainer.innerHTML = "লোগো";
        }
        
        let htmlContent = `
            <div style="line-height: 1.8; font-size: 14px; margin-top: 10px;">
                <p><b>বিবরণ:</b> ${displayTitle}</p>
                <ul style="padding-left: 20px; margin: 5px 0;">
                    <li>১. নির্ধারিত বিষয় এবং মূল কাঠামো সফলভাবে বিন্যস্ত হয়েছে।</li>
                    <li>২. প্রশ্নপত্র বা ফরমের মান ও নির্দেশিকা নিখুঁতভাবে তৈরি।</li>
                    <li>৩. সমস্ত আইটেম প্রফেশনাল লেআউটে সাজানো হয়েছে।</li>
                </ul>
            </div>
        `;
        
        document.getElementById('outContent').innerHTML = htmlContent;
        outputBox.style.display = 'block';
    }
</script>

</body>
                  </html>
