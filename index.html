<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamResult AI</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4f46e5;
            margin-bottom: 20px;
        }
        h1 {
            color: #1f2937;
            margin-bottom: 10px;
        }
        p {
            color: #4b5563;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #4338ca;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://ibb.co/dw2c3jjh" alt="Profile Image" class="profile-img">
        
        <h1>ExamResult AI-তে স্বাগতম</h1>
        <p>আপনার পরীক্ষার ফলাফল খুব সহজেই এআই-এর মাধ্যমে যাচাই করুন।</p>
        
        <button class="btn" onclick="alert('খুব শীঘ্রই সিস্টেম চালু হচ্ছে!')">ফলাফল দেখুন</button>
    </div>

</body>
  </html>
